aid: revagenix
name: Revagenix
description: 'Revagenix, Inc. is a private clinical-stage precision-therapeutics company
  headquartered in San Francisco, California, founded in 2019 by antibacterial-discovery
  veterans from Achaogen. The company takes a first-principles approach to drug design
  for serious chronic disease, engineering each candidate around target biology, route
  of delivery and tolerability. Its lead program, Rev-56, is a first-in-class inhaled
  precision therapy with a novel mechanism of action targeting chronic Pseudomonas
  infection in non-cystic-fibrosis bronchiectasis (NCFB), a progressive respiratory
  disease affecting an estimated 350,000 to 500,000 adults in the United States; Rev-56
  is entering Phase 1 clinical development in 2026, with a dry-powder formulation
  approaching candidate selection. Revagenix is backed by Novo Holdings, Tenmile, the
  REPAIR Impact Fund and the National Institute of Allergy and Infectious Diseases
  (NIAID contract 75N93022C00061). Revagenix is a therapeutics developer, not a software
  vendor: it publishes no API, SDK, developer portal or machine-readable contract.'
